name: Native checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bun for JavaScript adapters
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Node.js for npm compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Musl linker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native tests
        run: cargo test --locked
      - name: Crate verification
        run: cargo package --locked
      - name: Packaging adapter tests
        run: bun test packaging/check-crate.test.mjs
      - name: Crate allowlist
        run: bun packaging/check-crate.mjs target/package/tabula-repo-0.1.0.crate
      - name: Native release build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Linux archive
        run: bun packaging/build.mjs '${{ matrix.target }}' 'target/${{ matrix.target }}/release/tabula' '${{ runner.temp }}/tabula-packages'
      - name: Package smoke
        run: bun packaging/smoke.mjs '${{ runner.temp }}/tabula-packages'
