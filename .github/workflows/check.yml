name: Native checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native tests
        run: cargo test --locked
      - name: Crate verification
        run: cargo package --locked
      - name: Crate allowlist
        run: node packaging/check-crate.mjs target/package/tabula-repo-0.1.0.crate
      - name: Native release build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Unix archive
        if: runner.os != 'Windows'
        run: node packaging/build.mjs '${{ matrix.target }}' 'target/${{ matrix.target }}/release/tabula' '${{ runner.temp }}/tabula-packages'
      - name: Windows archive
        if: runner.os == 'Windows'
        run: node packaging/build.mjs '${{ matrix.target }}' 'target/${{ matrix.target }}/release/tabula.exe' '${{ runner.temp }}/tabula-packages'
      - name: Bun for package verification
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/tabula-tooling" --no-audit --no-fund bun@1.4.2
          echo "$RUNNER_TEMP/tabula-tooling/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Package smoke
        run: node packaging/smoke.mjs '${{ runner.temp }}/tabula-packages'
